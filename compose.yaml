services:
  pppic:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3333}:3333"
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3333}
      DATA_DIR: /app/data
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      STORAGE_LIMIT_MB: ${STORAGE_LIMIT_MB:-10240}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - pppic_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pppic_data:
